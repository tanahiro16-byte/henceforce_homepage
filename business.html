<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>事業紹介｜合同会社Henceforth</title>
<meta name="description" content="合同会社Henceforthの事業紹介。数学特化塾バディスタを運営しています。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #0065d4;
  --primary-dark: #22327a;
  --primary-light: #3b8be8;
  --primary-pale: #e8f1fc;
  --bg-main: #f7faff;
  --bg-white: #ffffff;
  --bg-gray: #f0f4f9;
  --text-dark: #242424;
  --text-body: #4a5568;
  --text-muted: #8a96a8;
  --border: #e2e8f0;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
  --shadow: 0 4px 24px rgba(0,0,0,0.07);
  --shadow-lg: 0 12px 48px rgba(0,0,0,0.1);
  --radius: 16px;
  --radius-sm: 12px;
  --section-space: 100px;
  --content-width: 1080px;
}
html { scroll-behavior: smooth; }
body { font-family: 'Noto Sans JP', sans-serif; color: var(--text-body); line-height: 1.9; background: var(--bg-main); font-size: 15px; overflow-x: hidden; }
img { max-width: 100%; height: auto; }
a { text-decoration: none; color: inherit; }
.inner { max-width: var(--content-width); margin: 0 auto; padding: 0 24px; }

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}
.fade-up { opacity: 0; transform: translateY(30px); transition: opacity 0.7s ease, transform 0.7s ease; }
.fade-up.visible { opacity: 1; transform: translateY(0); }

/* HEADER */
.header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(255,255,255,0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid rgba(226,232,240,0.5); transition: all 0.3s; }
.header.scrolled { box-shadow: 0 1px 20px rgba(0,0,0,0.05); }
.header-inner { max-width: var(--content-width); margin: 0 auto; padding: 0 24px; height: 68px; display: flex; justify-content: space-between; align-items: center; }
.logo { font-family: 'Roboto', sans-serif; font-size: 1.5rem; font-weight: 900; color: var(--primary-dark); letter-spacing: -0.02em; }
.header-nav { display: flex; align-items: center; gap: 8px; }
.header-nav a { font-size: 0.85rem; font-weight: 600; color: var(--text-dark); padding: 8px 16px; border-radius: 8px; transition: all 0.2s; }
.header-nav a:hover { background: var(--primary-pale); color: var(--primary); }
.header-nav .active { color: var(--primary); background: var(--primary-pale); }
.header-nav .header-cta { background: var(--primary); color: #fff; padding: 10px 24px; border-radius: 50px; margin-left: 8px; }
.header-nav .header-cta:hover { background: var(--primary-dark); }
.hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 8px; }
.hamburger span { display: block; width: 22px; height: 2px; background: var(--text-dark); border-radius: 2px; transition: all 0.3s; }

/* PAGE HERO */
.page-hero {
  padding: 140px 24px 60px;
  background: linear-gradient(135deg, #f7faff 0%, #e0edff 40%, #c7dcf9 70%, #f7faff 100%);
  text-align: center;
}
.page-hero .en {
  font-family: 'Roboto', sans-serif;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--primary);
  margin-bottom: 10px;
}
.page-hero h1 {
  font-size: clamp(1.5rem, 3.5vw, 2.2rem);
  font-weight: 900;
  color: var(--text-dark);
}

/* SECTION HEADING */
.sec-heading { text-align: center; margin-bottom: 56px; }
.sec-heading .en { font-family: 'Roboto', sans-serif; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--primary); display: inline-block; margin-bottom: 10px; }
.sec-heading h2 { font-size: clamp(1.4rem, 3.5vw, 1.9rem); font-weight: 900; color: var(--text-dark); line-height: 1.5; }
.sec-heading h2::after { content: ''; display: block; width: 40px; height: 3px; background: var(--primary); margin: 16px auto 0; border-radius: 2px; }

/* MISSION */
.mission {
  padding: var(--section-space) 24px;
  background: var(--bg-white);
}
.mission-lead {
  text-align: center;
  font-size: clamp(1.1rem, 2.5vw, 1.35rem);
  font-weight: 900;
  color: var(--text-dark);
  line-height: 1.8;
  max-width: 640px;
  margin: 0 auto 48px;
}

/* BUSINESS CARD */
.business-list {
  padding: var(--section-space) 24px;
  background: var(--bg-gray);
}
.business-card {
  max-width: 720px;
  margin: 0 auto;
  background: var(--bg-white);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  transition: all 0.3s;
}
.business-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-4px); }
.business-card-accent {
  height: 5px;
  background: linear-gradient(90deg, var(--primary), var(--primary-light));
  border-radius: var(--radius) var(--radius) 0 0;
}
.business-card-body { padding: 36px 40px; }
.business-card-tag {
  display: inline-block; font-size: 0.72rem; font-weight: 600;
  color: var(--primary); background: var(--primary-pale);
  padding: 4px 12px; border-radius: 50px; margin-bottom: 12px;
}
.business-card-title { font-size: 1.3rem; font-weight: 900; color: var(--text-dark); margin-bottom: 16px; }
.business-card-desc { font-size: 0.92rem; line-height: 2; color: var(--text-body); margin-bottom: 24px; }

/* DETAIL LIST */
.business-detail {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 8px;
}
.business-detail-item {
  display: flex; align-items: center; gap: 8px;
  font-size: 0.85rem; color: var(--text-dark); font-weight: 600;
}
.business-detail-item .icon {
  width: 36px; height: 36px;
  background: var(--primary-pale);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.business-detail-item .icon svg {
  width: 18px; height: 18px;
  stroke: var(--primary);
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* BUTTON */
.btn-outline {
  display: inline-flex; align-items: center; gap: 8px;
  border: 2px solid var(--primary); color: var(--primary);
  padding: 14px 36px; border-radius: 50px;
  font-size: 0.9rem; font-weight: 700; transition: all 0.3s;
}
.btn-outline:hover { background: var(--primary); color: #fff; }
.btn-outline .arrow { transition: transform 0.3s; }
.btn-outline:hover .arrow { transform: translateX(4px); }
.business-card-link {
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--primary); font-size: 0.88rem; font-weight: 700;
  transition: gap 0.3s;
}
.business-card-link:hover { gap: 10px; }

/* FOOTER */
.footer { background: var(--primary-dark); color: rgba(255,255,255,0.5); padding: 48px 24px 32px; }
.footer-inner { max-width: var(--content-width); margin: 0 auto; text-align: center; }
.footer-logo { font-family: 'Roboto', sans-serif; font-size: 1.2rem; font-weight: 900; color: rgba(255,255,255,0.8); margin-bottom: 20px; }
.footer-links { margin-bottom: 20px; }
.footer-links a { color: rgba(255,255,255,0.5); font-size: 0.78rem; margin: 0 14px; transition: color 0.2s; }
.footer-links a:hover { color: rgba(255,255,255,0.8); }
.footer-copy { font-size: 0.7rem; font-family: 'Roboto', sans-serif; }

@media (max-width: 781px) {
  .header-nav { display: none; }
  .hamburger { display: flex; }
}
@media (max-width: 551px) {
  :root { --section-space: 72px; }
  .page-hero { padding: 120px 20px 48px; }
  .business-card-body { padding: 24px 20px; }
  .business-detail { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header class="header" id="header">
  <div class="header-inner">
    <a href="index.html" class="logo">Henceforth</a>
    <nav class="header-nav">
      <a href="business.html" class="active">事業紹介</a>
      <a href="company.html">会社情報</a>
      <a href="index.html#contact" class="header-cta">お問い合わせ</a>
    </nav>
    <div class="hamburger" id="hamburger" onclick="this.classList.toggle('active')">
      <span></span><span></span><span></span>
    </div>
  </div>
</header>

<section class="page-hero">
  <p class="en">Business</p>
  <h1>事業紹介</h1>
</section>

<section class="mission">
  <div class="inner">
    <p class="mission-lead fade-up">教育を入口に、<br>これから先の社会を変える挑戦を。</p>
  </div>
</section>

<section class="business-list">
  <div class="inner">
    <div class="business-card fade-up">
      <div class="business-card-accent"></div>
      <div class="business-card-body">
        <span class="business-card-tag">数学特化塾</span>
        <h3 class="business-card-title">バディスタ</h3>
        <p class="business-card-desc">
          京大数学科出身プロ講師が、構造から理解する数学を教える少人数集団指導塾。<br>
          解法の暗記ではなく、問題の本質を見抜く力を育てます。
        </p>
        <div class="business-detail">
          <div class="business-detail-item">
            <span class="icon"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>対面 少人数集団（2〜5名）
          </div>
          <div class="business-detail-item">
            <span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span>週1回 90分
          </div>
          <div class="business-detail-item">
            <span class="icon"><svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></span>高校数学（学年・文理不問）
          </div>
          <div class="business-detail-item">
            <span class="icon"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></span>東京都世田谷区
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<footer class="footer">
  <div class="footer-inner">
    <div class="footer-logo">Henceforth</div>
    <div class="footer-links">
      <a href="index.html">トップ</a>
      <a href="company.html">会社情報</a>
      <a href="index.html#contact">お問い合わせ</a>
    </div>
    <p class="footer-copy">&copy; 2024&ndash;2026 Henceforth</p>
  </div>
</footer>

<script>
window.addEventListener('scroll', () => {
  document.getElementById('header').classList.toggle('scrolled', window.scrollY > 10);
});
const io = new IntersectionObserver((entries) => {
  entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
}, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
document.querySelectorAll('.fade-up').forEach(el => io.observe(el));
</script>
</body>
</html>
